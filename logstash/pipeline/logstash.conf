filter {
  json {
    source => "message"
  }

  # Parse timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Add event processing metadata
  mutate {
    add_field => {
      "[@metadata][index_prefix]" => "platform-events"
      "processed_at" => "%{+YYYY-MM-dd'T'HH:mm:ss.SSSZ}"
    }
  }

  # Enrich game events with duration categories
  if [event_type] == "game_ended" {
    if [game_duration_seconds] < 300 {
      mutate { add_field => { "duration_category" => "short" } }
    } else if [game_duration_seconds] < 1800 {
      mutate { add_field => { "duration_category" => "medium" } }
    } else {
      mutate { add_field => { "duration_category" => "long" } }
    }
  }

  # Calculate revenue for game purchase events
  if [event_type] == "game_purchased" {
    ruby {
      code => "
        price = event.get('price')
        event.set('revenue_eur', price)
        event.set('revenue_category', price < 5 ? 'micro' : price < 10 ? 'small' : 'large')
      "
    }
  }
  
  # Add retention category for platform retention
  if [event_type] == "user_platform_retention" {
    if [days_since_last_visit] <= 3 {
      mutate { add_field => { "retention_bucket" => "high_engagement" } }
    } else if [days_since_last_visit] <= 10 {
      mutate { add_field => { "retention_bucket" => "medium_engagement" } }
    } else {
      mutate { add_field => { "retention_bucket" => "low_engagement" } }
    }
  }
  
  # Add retention category for game retention
  if [event_type] == "user_game_retention" {
    if [days_since_last_play] <= 3 {
      mutate { add_field => { "retention_bucket" => "high_engagement" } }
    } else if [days_since_last_play] <= 10 {
      mutate { add_field => { "retention_bucket" => "medium_engagement" } }
    } else {
      mutate { add_field => { "retention_bucket" => "low_engagement" } }
    }
  }

  # Remove the message field
  mutate {
    remove_field => ["message"]
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_INTERNAL_PASSWORD}"
    index => "platform-events-%{+YYYY.MM.dd}"
  }

  # Debug output (comment out in production)
  stdout {
    codec => rubydebug
  }
}