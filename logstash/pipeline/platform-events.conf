input {
  # RabbitMQ input for platform events
  rabbitmq {
    host => "${RABBITMQ_HOST:rabbitmq}"
    port => 5672
    user => "${RABBITMQ_USER:admin}"
    password => "${RABBITMQ_PASSWORD:admin}"
    queue => "platform.events"
    durable => true
    codec => "json"
    tags => ["rabbitmq", "platform-events"]
  }
}

filter {
  # Parse JSON if not already parsed
  if [message] {
    json {
      source => "message"
      remove_field => ["message"]
    }
  }

  # Add processing timestamp
  mutate {
    add_field => { "[@metadata][processed_at]" => "%{+YYYY-MM-dd'T'HH:mm:ss.SSSZ}" }
  }

  # Categorize events
  if [event_type] in ["game_started", "game_ended", "game_abandoned", "winner_declared", "achievement_unlocked"] {
    mutate {
      add_field => { "event_category" => "gameplay" }
    }
  } else if [event_type] in ["user_logged_in", "user_logged_out", "user_registered", "friend_added"] {
    mutate {
      add_field => { "event_category" => "user_action" }
    }
  } else if [event_type] in ["gamePage_visit", "purchase_made", "payment_made"] {
    mutate {
      add_field => { "event_category" => "platform" }
    }
  }

  # Convert timestamp to proper format
  if [timestamp] {
    date {
      match => ["timestamp", "ISO8601", "yyyy-MM-dd'T'HH:mm:ss.SSSZ", "yyyy-MM-dd'T'HH:mm:ssZ"]
      target => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # Add session duration for logout events
  if [event_type] == "user_logged_out" and [session_start] and [session_end] {
    ruby {
      code => "
        begin
          start_time = Time.parse(event.get('session_start'))
          end_time = Time.parse(event.get('session_end'))
          duration = (end_time - start_time).to_i
          event.set('session_duration_seconds', duration)
        rescue => e
          event.tag('_rubyexception')
        end
      "
    }
  }

  # Validate required fields
  if ![event_type] {
    mutate {
      add_tag => ["missing_event_type"]
    }
  }

  # Remove internal fields
  mutate {
    remove_field => ["@version", "host"]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_writer_user"
    password => "changeme"
    index => "platform-events-%{+YYYY.MM.dd}"
    
    # Use event_type as document type for better indexing
    document_type => "_doc"
  }

  # Debug output (comment out in production)
  stdout {
    codec => rubydebug {
      metadata => true
    }
  }
}
