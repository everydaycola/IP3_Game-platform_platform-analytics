# GitLab CI/CD Pipeline voor Platform Analytics
# Gebruikt GitLab Container Registry voor Docker images

variables:
  # GitLab Container Registry
  REGISTRY: $CI_REGISTRY
  IMAGE_PREFIX: $CI_REGISTRY_IMAGE
  
  # Elastic Stack versie
  ELASTIC_VERSION: "8.15.3"
  
  # Docker Compose versie
  DOCKER_COMPOSE_VERSION: "2.23.0"

stages:
  - lint
  - test
  - build
  - deploy-dev
  - deploy-staging
  - deploy-prod

# Template voor Docker build jobs
.docker_build_template: &docker_build
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  # tags:
  #   - docker  # Commented out to use instance runners

# ===========================
# LINT STAGE
# ===========================

lint:python:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install flake8 black
  script:
    - echo "Running Python linting..."
    - flake8 scripts/ setup/ --max-line-length=120 --exclude=__pycache__,venv || true
    - echo "Checking Python formatting..."
    - black --check scripts/ setup/ || true
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

lint:yaml:
  stage: lint
  image: python:3.11-slim
  before_script:
    - pip install yamllint
  script:
    - echo "Validating YAML files..."
    - yamllint -d relaxed docker-compose.yml elasticsearch/config/ kibana/config/ logstash/config/ || true
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

# ===========================
# TEST STAGE
# ===========================

test:python:
  stage: test
  image: python:3.11-slim
  before_script:
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
  script:
    - echo "Running Python unit tests..."
    - pytest tests/ --cov=scripts --cov=setup --cov-report=term --cov-report=xml || true
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 week
  allow_failure: true
  only:
    - merge_requests
    - main
    - develop

# ===========================
# BUILD STAGE
# ===========================

build:elasticsearch:
  <<: *docker_build
  stage: build
  script:
    - echo "Building Elasticsearch image..."
    - docker build 
      --build-arg ELASTIC_VERSION=$ELASTIC_VERSION
      -t $IMAGE_PREFIX/elasticsearch:$CI_COMMIT_SHORT_SHA
      -t $IMAGE_PREFIX/elasticsearch:latest
      ./elasticsearch
    - docker push $IMAGE_PREFIX/elasticsearch:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_PREFIX/elasticsearch:latest
  only:
    - main
    - develop
    - merge_requests

build:logstash:
  <<: *docker_build
  stage: build
  script:
    - echo "Building Logstash image..."
    - docker build 
      --build-arg ELASTIC_VERSION=$ELASTIC_VERSION
      -t $IMAGE_PREFIX/logstash:$CI_COMMIT_SHORT_SHA
      -t $IMAGE_PREFIX/logstash:latest
      ./logstash
    - docker push $IMAGE_PREFIX/logstash:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_PREFIX/logstash:latest
  only:
    - main
    - develop
    - merge_requests

build:kibana:
  <<: *docker_build
  stage: build
  script:
    - echo "Building Kibana image..."
    - docker build 
      --build-arg ELASTIC_VERSION=$ELASTIC_VERSION
      -t $IMAGE_PREFIX/kibana:$CI_COMMIT_SHORT_SHA
      -t $IMAGE_PREFIX/kibana:latest
      ./kibana
    - docker push $IMAGE_PREFIX/kibana:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_PREFIX/kibana:latest
  only:
    - main
    - develop
    - merge_requests

build:setup:
  <<: *docker_build
  stage: build
  script:
    - echo "Building Setup image..."
    - docker build 
      -t $IMAGE_PREFIX/setup:$CI_COMMIT_SHORT_SHA
      -t $IMAGE_PREFIX/setup:latest
      -f setup/Dockerfile
      .
    - docker push $IMAGE_PREFIX/setup:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_PREFIX/setup:latest
  only:
    - main
    - develop
    - merge_requests

# ===========================
# DEPLOY DEVELOPMENT
# ===========================

deploy:development:
  stage: deploy-dev
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - apk add --no-cache curl docker-compose
  script:
    - echo "Deploying to development environment..."
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    
    # Stop bestaande containers
    - docker-compose -f docker-compose.gitlab.yml down || true
    
    # Pull nieuwe images
    - docker-compose -f docker-compose.gitlab.yml pull
    
    # Start Elasticsearch eerst
    - docker-compose -f docker-compose.gitlab.yml up -d elasticsearch
    
    # Wacht op health check
    - |
      for i in $(seq 1 60); do
        if docker-compose -f docker-compose.gitlab.yml ps elasticsearch | grep -q "healthy"; then
          echo "Elasticsearch is healthy!"
          break
        fi
        echo "Waiting for Elasticsearch... ($i/60)"
        sleep 5
      done
    
    # Run setup
    - docker-compose -f docker-compose.gitlab.yml --profile=setup run --rm setup
    
    # Start alle services
    - docker-compose -f docker-compose.gitlab.yml up -d
    
    # Health check voor alle services
    - sleep 30
    - docker-compose -f docker-compose.gitlab.yml ps
    
  environment:
    name: development
    url: http://dev.platform-analytics.local:5601
  only:
    - develop
  tags:
    - docker
    - development

# ===========================
# DEPLOY STAGING
# ===========================

deploy:staging:
  stage: deploy-staging
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - apk add --no-cache curl docker-compose
  script:
    - echo "Deploying to staging environment..."
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    - docker-compose -f docker-compose.gitlab.yml down || true
    - docker-compose -f docker-compose.gitlab.yml pull
    - docker-compose -f docker-compose.gitlab.yml up -d elasticsearch
    - sleep 90
    - docker-compose -f docker-compose.gitlab.yml --profile=setup run --rm setup
    - docker-compose -f docker-compose.gitlab.yml up -d
    - sleep 30
    - docker-compose -f docker-compose.gitlab.yml ps
  environment:
    name: staging
    url: http://staging.platform-analytics.local:5601
  only:
    - main
  tags:
    - docker
    - staging

# ===========================
# DEPLOY PRODUCTION
# ===========================

deploy:production:
  stage: deploy-prod
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - apk add --no-cache curl docker-compose
  script:
    - echo "Deploying to PRODUCTION environment..."
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA
    
    # Backup voor rollback
    - docker-compose -f docker-compose.gitlab.yml ps > deployment_state_before.txt || true
    
    # Deploy
    - docker-compose -f docker-compose.gitlab.yml down || true
    - docker-compose -f docker-compose.gitlab.yml pull
    - docker-compose -f docker-compose.gitlab.yml up -d elasticsearch
    - sleep 90
    - docker-compose -f docker-compose.gitlab.yml --profile=setup run --rm setup
    - docker-compose -f docker-compose.gitlab.yml up -d
    
    # Uitgebreide health checks
    - sleep 60
    - docker-compose -f docker-compose.gitlab.yml ps
    - curl -s -u elastic:changeme http://localhost:9200/_cluster/health || exit 1
    - curl -s http://localhost:5601/api/status || exit 1
    
  environment:
    name: production
    url: http://platform-analytics.local:5601
  when: manual
  only:
    - main
  tags:
    - docker
    - production
  artifacts:
    paths:
      - deployment_state_before.txt
    expire_in: 1 week
