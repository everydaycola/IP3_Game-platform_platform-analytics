# Python testing configuratie

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --cov=scripts
    --cov=setup
    --cov-report=term-missing
    --cov-report=xml
    --strict-markers

[coverage:run]
source = scripts,setup
omit = 
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
